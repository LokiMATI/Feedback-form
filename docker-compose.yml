version: "3"

services:
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Feedback
      MYSQL_USER: Lucky
      MYSQL_PASSWORD: root

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    ports:
    - "8080:80" 
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root